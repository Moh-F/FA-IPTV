name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Version
        run: |
          echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "VER=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }

      - name: Check signing secrets exist
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Missing secret KEYSTORE_B64. Run scripts/create_keystore.sh and add the 4 secrets (see README)."; exit 1; fi

      - name: Decode keystore
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease -PVERSION_NAME="$VER" -PversionCode="${{ github.run_number }}" --stacktrace
          mkdir -p out
          for abi in universal arm64-v8a armeabi-v7a; do
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "out/FA-IPTV-v$VER-$abi.apk"
          done
          ls -la out

      - name: Verify the APKs are signed
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          for f in out/*.apk; do "$APKSIGNER" verify --print-certs "$f" | head -2; done

      - name: Create latest.json (used by the in-app updater)
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          sha() { sha256sum "out/FA-IPTV-v$VER-$1.apk" | cut -d' ' -f1; }
          jq -n --arg v "$VER" --argjson b "${{ github.run_number }}" \
            --arg ar "$(cat release_notes/ar.md)" --arg en "$(cat release_notes/en.md)" --arg de "$(cat release_notes/de.md)" \
            --arg u "$BASE/FA-IPTV-v$VER-universal.apk" --arg su "$(sha universal)" \
            --arg a64 "$BASE/FA-IPTV-v$VER-arm64-v8a.apk" --arg s64 "$(sha arm64-v8a)" \
            --arg a32 "$BASE/FA-IPTV-v$VER-armeabi-v7a.apk" --arg s32 "$(sha armeabi-v7a)" \
            '{version:$v,build:$b,minBuild:1,mandatory:false,notes:{ar:$ar,en:$en,de:$de},
              assets:{android:{url:$u,sha256:$su},"android-arm64-v8a":{url:$a64,sha256:$s64},"android-armeabi-v7a":{url:$a32,sha256:$s32}}}' > out/latest.json
          cat out/latest.json

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release made by hand on GitHub (also from the phone): attach the APKs to it.
          # Tag pushed from a PC: create a draft release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk out/latest.json --clobber
          else
            gh release create "$TAG" out/*.apk out/latest.json --draft --title "$TAG" --notes-file release_notes/en.md
          fi
